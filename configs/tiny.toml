# About 0.82M parameters. CPU friendly; auto selects CUDA when available.
[model]
block_size = 128
n_layer = 4
n_head = 4
n_embd = 128
dropout = 0.1

[train]
data_dir = "data/fantasy"
out_dir = "out/tiny"
device = "auto"
batch_size = 16
gradient_accumulation_steps = 1
max_iters = 2000
eval_interval = 100
eval_iters = 10
log_interval = 10
learning_rate = 0.0003
min_lr = 0.00003
warmup_iters = 20
lr_decay_iters = 2000
threads = 4
amp = true
