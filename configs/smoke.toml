# Fast end-to-end check, not a model-quality training recipe.
[model]
block_size = 32
n_layer = 2
n_head = 2
n_embd = 64
dropout = 0.0

[train]
data_dir = "data/fantasy"
out_dir = "out/smoke"
device = "cpu"
batch_size = 4
max_iters = 10
eval_interval = 5
eval_iters = 2
log_interval = 5
warmup_iters = 2
lr_decay_iters = 100
threads = 2
amp = false
